services:
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-campus-pulse-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-45m}
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173
      NODE_ENV: production
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      API_PROXY: http://backend:4000
    depends_on:
      - backend
    restart: unless-stopped
